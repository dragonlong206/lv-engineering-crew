schema: spec-driven
context: >-
  LV Crew context: before proposing, designing, or implementing anything, read:

  - the feature docs under `docs/features/<feature-id>/{overview.md,design.md}`
  for any feature IDs this change touches

  - the current change's ticket/description context in
  `docs/changes/<change-id>/state.yaml` (the directory matching the current git
  branch)

  - if you are running `/opsx:sync` directly (syncing delta specs to main specs
  without archiving), also refresh docs for any feature IDs this change touches
  by invoking the `lv-bootstrap` skill/command for each — this is a convention,
  not enforced by any tooling check



  - also check `.lv.yaml` for an `output_language` setting; if set, write all
  generated artifact prose in that language — code blocks, identifiers, file
  paths, and command names stay untranslated, headings may stay in English
operations:
  archive:
    guidance:
      - >-
        When archiving, sync all delta to OpenSpec specs by default. Before
        completing this archive, refresh the docs of every feature this change
        touches by invoking the `lv-bootstrap` skill/command for that feature ID
        (bare `lv bootstrap <feature-id>` now errors without an explicit mode
        flag): use the feature IDs recorded in this change's
        `docs/changes/<change-id>/state.yaml` when present; otherwise, for each
        of this change's delta spec capability paths, treat its leading path
        segment as a feature ID and refresh it if a matching
        `docs/features/<id>/` directory exists.
  apply:
    guidance:
      - >-
        When implementing, write automated tests covering each `#### Scenario:`
        in this change's delta specs, following this repo's existing test
        framework, test file locations, and naming conventions (discover them
        from the existing test suite rather than choosing your own), and run
        those tests before marking the related tasks complete. If this repo has
        no automated test framework, do not introduce one unless this change's
        tasks explicitly call for it; instead, report which delta spec scenarios
        remain without automated coverage. If this change has no delta spec
        scenarios, this guidance asks for nothing spec-specific.

rules:
  tasks:
    - "Include explicit tasks for writing automated tests that cover the `#### Scenario:` blocks in this change's delta specs, using this repo's existing test framework and conventions; each such task must name the scenario(s) it covers. If this repo has no automated test framework, plan manual or scripted verification steps per scenario instead of tasks that introduce a new framework."
