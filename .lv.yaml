lark:
  base_id: "xxx"
  table_id: "xxx"
  feature_id_field: "Feature ID" # column name for feature IDs in Lark Base
  title_field: "Title" # column name used as the ticket title (branch {summary}, analysis prompt)

  # Whether `lv start` writes a feature ID it allocates for a brand-new feature
  # back to the ticket's Feature ID field above. Requires the app's tenant token
  # to carry Bitable write scope. Default true; set false to keep allocations local-only.
  # sync_feature_id: true

  # Table (in the same Base) to record every newly created feature in. Unset skips
  # the Features-table sync entirely, regardless of sync_new_features below.
  # features_table_id: "xxx"

  # Whether `lv bootstrap`/`lv start` create a record in features_table_id for a
  # brand-new feature. Requires the app's tenant token to carry Bitable write scope.
  # Default true; set false to keep new features local-only.
  # sync_new_features: true

default_branch: main

# Branch naming per type — {ticket_id} and {summary} are the only placeholders
# ({summary} is a slug of the ticket title, filled in by `lv start`). Omit to
# use the built-in default:
#   { feature: "feature/{ticket_id}-{summary}", hotfix: "hotfix/{ticket_id}-{summary}" }
# `lv start <id> --type hotfix` picks a type explicitly; default_branch_type is
# used otherwise.
# branch_types:
#   feature: "feature/{ticket_id}-{summary}"
#   hotfix: "hotfix/{ticket_id}-{summary}"
# default_branch_type: feature

# Default model — used when no per-step model is declared
model: openai/gpt-4o

# Per-step model — omit a field to fall back to the default
models:
  analysis: openai/gpt-5.4-mini
  design: openai/gpt-5.4-mini
  bootstrap: openai/gpt-5.4-mini
  init: openai/gpt-5.4-mini

# Feature ID auto-increment used by `lv init` (e.g. F0001, F0002, ...)
feature_id_prefix: "F"
feature_id_digits: 4

# Which files `lv bootstrap`/`lv init` read from the target repo.
# Omit either to use the built-in default (src/tools/codebase.ts) — covers
# a broad set of stacks already, including .NET/C#/ASP.NET. Override for a
# stack the default doesn't cover, e.g.:
# scan_extensions: [cs, vb, cshtml, razor, csproj, sln, json, xml, config]
# scan_skip_dirs: [bin, obj, .vs, packages, node_modules, .git]
