lark:
  base_id: "xxx"
  table_id: "xxx"
  feature_id_field: "Feature ID"   # column name for feature IDs in Lark Base

default_branch: main

# Default model — used when no per-step model is declared
model: openai/gpt-4o

# Per-step model — omit a field to fall back to the default
models:
  analysis: openai/gpt-4o
  design: openai/gpt-4o
  bootstrap: openai/gpt-4o-mini
