ticket_id: recvvVHvg8zvVm
title: '`lv start` can split big task to smaller sub-tasks'
description: >-
  `lv start` can analyze the task first, if it is too complicated, contains
  multiple separated tasks or takes too much time to implement (> 4 hours) then
  it suggest to human to split to sub tasks. If human agrees, it creates the sub
  tasks, sync them to ticket system with relationship and then guide user to
  start one by one or create an agent team to start parallel if possible
