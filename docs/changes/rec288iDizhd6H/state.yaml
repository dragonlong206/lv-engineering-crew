title: >-
  `lv start` should checkout from different branches for different feature
  types 
description: >-
  Basing on gitflow, some repo can have multiple long-lived branches and
  different feature types can be checked out from different branch. For example:
  hotfix should be checked out from `master`, while feature from `develop`.

  All of these must be configurable.
